[package]
name = "social-workspace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A personal desktop home for your web apps"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
rqrr = "0.10"
atomicwrites = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
wry = "0.55"
tao = "0.34"
rfd = "0.15"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
